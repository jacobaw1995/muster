<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e0f0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Muster — Operator Standard Events</title>
    <!--
      Default Open Graph / Twitter Card meta (Phase 8). The api/event-og.js
      serverless function replaces this whole OG:START/OG:END block with
      per-event tags for /events/:id requests (see vercel.json's rewrite) —
      the markers give it a single, unambiguous block to swap out rather
      than hunting for individual tags. Every other route serves this
      static default as-is.
    -->
    <meta name="description" content="Discover, create, and RSVP to local rucks, cleanups, training & more." />
    <!-- OG:START -->
    <meta property="og:site_name" content="Muster" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Muster — Operator Standard Events" />
    <meta property="og:description" content="Discover, create, and RSVP to local rucks, cleanups, training & more." />
    <meta property="og:image" content="https://www.eventmuster.com/og-default.png" />
    <meta property="og:url" content="https://www.eventmuster.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Muster — Operator Standard Events" />
    <meta name="twitter:description" content="Discover, create, and RSVP to local rucks, cleanups, training & more." />
    <meta name="twitter:image" content="https://www.eventmuster.com/og-default.png" />
    <!-- OG:END -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
